<!DOCTYPE html>
<html lang="en">
  <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
         <link rel="stylesheet" href="./style.css"> 

        <title>Frontend Mentor | Blog preview card</title>

  </head>

  <body>
    <main>
      <section class="card">
        <img src="./assets/images/illustration-article.svg" alt="">

        <article class="card-content">

          <span class="card-badge">Learning</span>

          <p class="card-date">Published 21 dec 2023</p>

          <h1 class="card-title"> HTML & CSS foundations</h1>

          <p class="card-desc">
             These languages are the backbone of every website, defining structure, content, and presentation.
          </p>

        </article>

        <article class="card-autor">
          <img src="./assets/images/image-avatar.webp" alt="">

          <span class="author-name">Greg Hooper</span>

        </article>

      </section>
    </main>

    <footer class="attribution">
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
            Coded by <a href="#">cedrick Mbuyamba</a>.
    </footer>
  </body>
</html>
